name: CI

on:
  push:
    branches: [a0-cleanup, main]
  pull_request:
    branches: [a0-cleanup, main]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML
        shell: pwsh

      - name: Run unit tests
        id: unittest
        shell: pwsh
        run: |
          python -m unittest tests.unit.test_asr_bootstrap_r2 tests.unit.test_path_migration_r1 -v 2>&1 | Tee-Object -FilePath unittest-output.txt
          $testExitCode = $LASTEXITCODE
          Write-Host "Unittest exit code: $testExitCode"
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

      - name: Upload unittest failure log
        if: ${{ failure() && steps.unittest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: unittest-failure-log
          path: unittest-output.txt
          if-no-files-found: warn
