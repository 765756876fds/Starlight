name: CI

on:
  push:
    branches: [a0-cleanup, main]
  pull_request:
    branches: [a0-cleanup, main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML
        shell: pwsh

      - name: Diagnose imports
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== Python version ==="
          python --version
          python -c "import sys; print('sys.path:'); [print(' ', p) for p in sys.path]"

          Write-Host "`n=== Check yaml ==="
          python -c "import yaml; print('yaml OK:', yaml.__file__, getattr(yaml,'__version__','?'))"

          Write-Host "`n=== Check requests ==="
          python -c "import requests; print('requests OK:', requests.__file__, requests.__version__)"

          Write-Host "`n=== Check tests ==="
          python -c "import tests; print('tests OK:', tests.__file__); print('tests path:', list(tests.__path__))"

          Write-Host "`n=== Check app.core.config ==="
          python -c "from app.core import config; print('app.core.config OK:', config.__file__)"

          Write-Host "`n=== Check app.voice.asr_bootstrap ==="
          python -c "from app.voice import asr_bootstrap; print('app.voice.asr_bootstrap OK:', asr_bootstrap.__file__)"

          Write-Host "`n=== Check test_asr_bootstrap_r2 ==="
          python -c "import tests.unit.test_asr_bootstrap_r2; print('test_asr_bootstrap_r2 OK')"

          Write-Host "`n=== Check test_path_migration_r1 ==="
          python -c "import tests.unit.test_path_migration_r1; print('test_path_migration_r1 OK')"

      - name: Run unit tests
        id: unittest
        shell: pwsh
        run: |
          python -m unittest tests.unit.test_asr_bootstrap_r2 tests.unit.test_path_migration_r1 -v 2>&1 | Tee-Object -FilePath unittest-output.txt
          $testExitCode = $LASTEXITCODE
          Write-Host "Unittest exit code: $testExitCode"
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

      - name: Upload unittest failure log
        if: ${{ failure() && steps.unittest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: unittest-failure-log
          path: unittest-output.txt
          if-no-files-found: warn
