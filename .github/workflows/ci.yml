name: CI

on:
  push:
    branches: [a0-cleanup, main]
  pull_request:
    branches: [a0-cleanup, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Windows CI (syntax + unit tests)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Syntax check (compile all sources)
        shell: pwsh
        run: |
          python -m compileall -q app main.py tests scripts tools
      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest tests/unit -o addopts="" -q 2>&1 | Tee-Object -FilePath pytest-output.txt
          exit $LASTEXITCODE
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-windows-failure-log
          path: pytest-output.txt
          if-no-files-found: warn
